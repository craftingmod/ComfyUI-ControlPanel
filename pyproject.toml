[project]
name = "comfyui-controlpanel"
description = "A lightweight ComfyUI control panel that restores legacy local administration features no longer available in ComfyUI Manager."
version = "1.2.1"
requires-python = ">=3.12"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
  "aiohttp>=3.9",
]

[dependency-groups]
dev = [
  "bump-my-version>=1.2.2",
  "pytest>=8.4.2",
]

[project.urls]
Repository = "https://github.com/craftingmod/ComfyUI-ControlPanel"

[tool.comfy]
PublisherId = "alyac"
DisplayName = "ComfyUI-ControlPanel"
Icon = "https://cdn.jsdelivr.net/gh/craftingmod/ComfyUI-ControlPanel/assets/icon.svg"
requires-comfyui = ">=0.28.0"
includes = ['dist']

[tool.bumpversion]
current_version = "1.2.1"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
commit = false
tag = false
tag_name = "v{new_version}"
tag_message = "Release version {new_version}"
message = "chore: bump version to {new_version} [skip ci]"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "package.json"
search = '"version": "{current_version}"'
replace = '"version": "{new_version}"'
