name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use Python from .python-version
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Bun dependencies
        run: bun ci

      - name: Sync Python dependencies
        run: uv sync --locked --group dev

      - name: Run validate
        run: bun run validate:ci

      - name: Build frontend
        run: bun run build

      - name: Build Registry package
        run: bun run build:custom-node
