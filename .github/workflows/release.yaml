name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Use Python from .python-version
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Verify tag and project version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: >-
          python -c "import os, pathlib, tomllib;
          expected = os.environ['RELEASE_VERSION'].removeprefix('v');
          project = tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'];
          assert project == expected, f'version mismatch: tag={expected}, pyproject={project}'"

      - name: Verify required release files
        run: |
          test -f __init__.py
          test -f backend/__init__.py
          test -f dist/index.js
          test -f pyproject.toml

      - name: Publish to Comfy Registry
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
          skip_checkout: "true"

      - name: Create installable zip
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: ./scripts/New-CustomNodesZip.ps1 -Version $env:RELEASE_VERSION -OutputDirectory release -Force

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: release/ComfyUI-ControlPanel-${{ github.ref_name }}.zip
          generate_release_notes: true
