<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1280"
  height="320"
  viewBox="0 0 1280 320"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">ControlPanel</title>
  <desc id="description">A modern control panel symbol beside the ControlPanel wordmark.</desc>

  <rect width="1280" height="320" fill="#ffffff"/>

  <!-- Control panel symbol -->
  <g transform="translate(44 44)">
    <rect width="232" height="232" rx="52" fill="#111111"/>

    <g fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round">
      <path d="M52 70H180"/>
      <path d="M52 116H180"/>
      <path d="M52 162H180"/>
    </g>

    <g fill="#ffffff" stroke="#111111" stroke-width="10">
      <circle cx="91" cy="70" r="17"/>
      <circle cx="151" cy="116" r="17"/>
      <circle cx="112" cy="162" r="17"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text
    x="330"
    y="199"
    fill="#111111"
    font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="104"
    font-weight="650"
    letter-spacing="-4"
  >ControlPanel</text>
</svg>
