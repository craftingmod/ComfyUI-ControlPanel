# Exclude a variety of commonly ignored directories.
exclude = [
  ".agents",
  "old",
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".ipynb_checkpoints",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pyenv",
  ".pytest_cache",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  ".vscode",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "site-packages",
  "venv",
]

# Pin cache dir
cache-dir = ".ci-cache/ruff"

# Same as Black.
line-length = 88
indent-width = 2

# Assume Python 3.12
target-version = "py312"

[lint]
# select = [...]  # See the Default Rules page for the full listing.
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

# Project name - error
[lint.per-file-ignores]
"__init__.py" = ["N999"]
"backend/__init__.py" = ["N999"]

# Preserve existing boundary behavior: optional ComfyUI imports/startup guards
# tolerate host errors, and malformed Registry data raises ValueError to callers.
"backend/manager_api.py" = ["BLE001"]
"backend/manager_routes.py" = ["BLE001"]
"backend/manager_runtime.py" = ["BLE001", "S110"]
"backend/registry_cache.py" = ["TRY004"]
